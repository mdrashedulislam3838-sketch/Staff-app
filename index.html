let LANG="bn";try{LANG=localStorage.getItem("lang")||"bn"}catch(e){}
const BNRE=/[\u0980-\u09FF]/;
function tr(s){
  if(LANG!=="en"||s==null)return s;
  s=String(s);if(!BNRE.test(s))return s;
  const t=s.trim();
  if(EN[t]!==undefined)return s.replace(t,()=>EN[t]);
  const m=t.match(/^([^\p{L}\p{N}]*)([\s\S]*?)([\s:।.…!?]*)$/u);
  if(m&&m[2]&&EN[m[2]]!==undefined)return s.replace(t,()=>m[1]+EN[m[2]]+m[3].replace(/।/g,"."));
  return s;
}
const langBtn=()=>`<div class="lang"><button class="${LANG==="bn"?"on":""}" onclick="setLang('bn')">BN</button><button class="${LANG==="en"?"on":""}" onclick="setLang('en')">EN</button></div>`;
function setLang(l){LANG=l;try{localStorage.setItem("lang",l)}catch(e){}document.documentElement.lang=l;document.title=l==="en"?"Staff Movement Monitoring - SED Sector":"স্টাফ মুভমেন্ট মনিটরিং - SED সেক্টর";render()}

window.alert=m=>_al(tr(m));window.confirm=m=>_cf(tr(m));window.prompt=(m,d)=>_pr(tr(m),d);
function trTxt(n){const v=n.nodeValue;if(v&&BNRE.test(v)){const t=tr(v);if(t!==v)n.nodeValue=t}}
function trAttrs(e){["placeholder","title","aria-label"].forEach(a=>{const v=e.getAttribute(a);if(v&&BNRE.test(v)){const t=tr(v);if(t!==v)e.setAttribute(a,t)}})}
function trTree(r){
  if(LANG!=="en")return;
  if(r.nodeType===3)return trTxt(r);
  if(r.nodeType!==1||/^(SCRIPT|STYLE)$/.test(r.nodeName))return;
  trAttrs(r);r.querySelectorAll("[placeholder],[title],[aria-label]").forEach(trAttrs);
  const w=document.createTreeWalker(r,NodeFilter.SHOW_TEXT),L=[];let n;
  while(n=w.nextNode()){if(!/^(SCRIPT|STYLE)$/.test(n.parentNode.nodeName))L.push(n)}
  L.forEach(trTxt);
}

const BENV="বেনিফিশিয়ারি ভিজিট";
const benChar=b=>b.char||D.groupChar[b.group]||"";
const cOpts=ph=>`<option value="">${ph}</option>`+optsAllowed("chars",D.chars).map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("");
const gOpts=(cn,ph)=>`<option value="">${ph}</option>`+D.groups.filter(g=>{const m=D.groupChar[g];if(cn)return !m||m===cn;const l=allow("chars");return !l||!m||l.includes(m)}).map(g=>`<option value="${esc(g)}">${esc(g)}${D.groupChar[g]&&!cn?" ("+tr("চর")+": "+esc(tr(D.groupChar[g]))+")":""}</option>`).join("");
const benFor=(c,gi)=>gi==="x"?[]:D.bens.filter(b=>b.group===D.groups[gi]&&(c==="x"||!benChar(b)||benChar(b)===D.chars[c])&&okBen(b));
const chkId=(n,items,on,hint)=>items.length?`<div class="ck">${items.map(([id,t])=>`<label><input type="checkbox" name="${n}" value="${id}" ${on.includes(id)?"checked":""}>${esc(t)}</label>`).join("")}</div>`:`<span class="muted">${hint}</span>`;
const bn=ids=>toArr(ids).map(id=>(D.bens.find(b=>b.id===id)||{}).name).filter(Boolean).join(", ");
const benTxt=m=>[bn(m.bens)&&tr("ভিজিট")+": "+bn(m.bens),bn(m.fol)&&tr("ফলোআপ")+": "+bn(m.fol)].filter(Boolean).join(" | ");
const benFilter=(cf,gf)=>D.bens.filter(b=>(!cf||benChar(b)===cf)&&(!gf||b.group===gf)&&okBen(b)).sort((a,b)=>a.group.localeCompare(b.group)||a.name.localeCompare(b.name));
function benView(){
  $("c").innerHTML=`<div class="card"><h3>নতুন বেনিফিশিয়ারি যোগ করুন</h3>
  <label>চর</label><select id="bc" onchange="$('bg').innerHTML=gOpts(this.value,'-- গ্রুপ সিলেক্ট করুন --')">${cOpts("-- চর সিলেক্ট করুন --")}</select>
  <label>গ্রুপ</label><select id="bg">${gOpts("","-- গ্রুপ সিলেক্ট করুন --")}</select>
  <label>নাম</label><input id="bn">
  <label>পিতার নাম</label><input id="bf">
  <label>মোবাইল</label><input id="bm" type="tel" inputmode="numeric">
  <label>এনআইডি কার্ড নম্বর</label><input id="bi" inputmode="numeric"><br><br>
  <button onclick="addBen()">যোগ করুন</button></div>
  <div class="card"><div class="row"><div><label>চর অনুযায়ী দেখুন</label><select id="bcf" onchange="$('bfl').innerHTML=gOpts(this.value,'সব গ্রুপ');benList()">${cOpts("সব চর")}</select></div>
  <div><label>গ্রুপ অনুযায়ী দেখুন</label><select id="bfl" onchange="benList()">${gOpts("","সব গ্রুপ")}</select></div></div><div id="bl"></div></div>`;
  benList();
}
function addBen(){
  const g=$("bg").value,n=$("bn").value.trim();
  if(!g)return alert("গ্রুপ সিলেক্ট করুন");
  if(!n)return alert("নাম লিখুন");
  const ch=$("bc").value||D.groupChar[g]||"";if(allow("chars")&&!ch)return alert("চর সিলেক্ট করুন");
  const b={id:uid(),char:ch,group:g,name:n,father:$("bf").value.trim(),mobile:$("bm").value.trim(),nid:$("bi").value.trim()};
  D.bens.push(b);saveBen(b);
  ["bn","bf","bm","bi"].forEach(i=>$(i).value="");$("bn").focus();benList();
}
function benList(){
  const l=benFilter($("bcf")?$("bcf").value:"",$("bfl")?$("bfl").value:"");
  $("bl").innerHTML=`<p class="muted">${tr("মোট")}: ${l.length}${LANG==="en"?"":" জন"}</p>`+(l.map(b=>`<div class="item"><div><b>${esc(b.name)}</b> <span class="muted">(${esc(tr(benChar(b)||"চর নেই"))} · ${esc(b.group)})</span><div class="muted">${LANG==="en"?"Father":"পিতা"}: ${esc(b.father||"-")} · ${tr("মোবাইল")}: ${esc(b.mobile||"-")} · NID: ${esc(b.nid||"-")}</div></div>${isMgr()?`<button class="sm red" onclick="delBen('${b.id}')">মুছুন</button>`:""}</div>`).join("")||'<span class="muted">কোনো বেনিফিশিয়ারি নেই</span>');
}
function delBen(id){if(confirm("মুছবেন?")){D.bens=D.bens.filter(b=>b.id!==id);delBenDb(id);benList()}}

/* ---------- Input support ---------- */
function inpView(){
  $("c").innerHTML=`${me.role==="admin"?`<div class="card"><h3>ইনপুটের ধরন</h3><div class="row"><input id="nt" placeholder="নতুন ধরন (যেমন: কীটনাশক)"><button style="flex:0" onclick="addType()">যোগ</button></div><div class="muted" style="margin-top:6px">${D.inputTypes.map(esc).join(" · ")}</div></div>`:""}
  <div class="card"><div class="row"><div><label>চর</label><select id="icf" onchange="$('igf').innerHTML=gOpts(this.value,'সব গ্রুপ');inputList()">${cOpts("সব চর")}</select></div>
  <div><label>গ্রুপ</label><select id="igf" onchange="inputList()">${gOpts("","সব গ্রুপ")}</select></div></div></div><div id="il"></div>`;
  inputList();
}
function addType(){const v=$("nt").value.trim();if(!v)return;if(D.inputTypes.includes(v))return alert("আগে থেকেই আছে");D.inputTypes.push(v);save();inpView()}
function inputList(){
  const l=benFilter($("icf")?$("icf").value:"",$("igf")?$("igf").value:"");
  $("il").innerHTML=l.map(b=>{const ins=D.inputs.filter(i=>i.benId===b.id);
    return `<div class="card"><b>${esc(b.name)}</b> <span class="muted">(${esc(tr(benChar(b)||"চর নেই"))} · ${esc(b.group)})</span>
    <div style="margin:6px 0">${ins.map(i=>`<span class="badge d" style="display:inline-block;margin:2px">${esc(tr(i.type))}${i.qty?": "+esc(i.qty):""} · ${esc(i.date)}${isMgr()?` <a onclick="delInp('${i.id}')" style="cursor:pointer">✕</a>`:""}</span>`).join("")||'<span class="muted">কোনো ইনপুট সাপোর্ট নেই</span>'}</div>
    <div class="row"><select id="it_${b.id}">${opts(D.inputTypes,"","-- ইনপুট --")}</select><input id="iq_${b.id}" placeholder="পরিমাণ (যেমন ৫ কেজি)"><button style="flex:0" onclick="addInp('${b.id}')">যোগ</button></div></div>`}).join("")||'<div class="card muted">কোনো বেনিফিশিয়ারি নেই। আগে বেনিফিশিয়ারি ট্যাবে যোগ করুন।</div>';
}
function addInp(id){
  const t=$("it_"+id).value;if(!t)return alert("ইনপুটের ধরন সিলেক্ট করুন");
  const i={id:uid(),benId:id,type:t,qty:$("iq_"+id).value.trim(),date:today(),by:me.role==="admin"?"এডমিন":me.name};
  D.inputs.push(i);saveInp(i);inputList();
}
function delInp(id){if(confirm("মুছবেন?")){D.inputs=D.inputs.filter(i=>i.id!==id);delInpDb(id);inputList()}}

/* ---------- Report ---------- */
function filtered(){
  return D.moves.filter(m=>moveInScope(m)&&(!F.from||m.date>=F.from)&&(!F.to||m.date<=F.to)&&(!F.s||m.staffId===F.s)&&(!F.a||toArr(m.act).includes(F.a))&&(!F.st||m.status===F.st)&&(!F.ar||toArr(m.ap).some(x=>x.a===F.ar))&&(!F.pj||toArr(m.ap).some(x=>x.p.includes(F.pj)))&&(!F.ch||toArr(m.char).includes(F.ch))&&(!F.gr||toArr(m.group).includes(F.gr))&&(!F.hb||toArr(m.hap).includes(F.hb))).sort((a,b)=>b.date.localeCompare(a.date));
}
function report(){
  const l=filtered(),pl=l.filter(m=>m.status==="পরিকল্পিত").length,dn=l.length-pl;
  $("c").innerHTML=`<div class="card noprint"><div class="row">
  <div><label>থেকে</label><input type="date" id="ff" onchange="applyF()" value="${F.from||""}"></div>
  <div><label>পর্যন্ত</label><input type="date" id="ft" onchange="applyF()" value="${F.to||""}"></div>
  <div><label>স্টাফ</label><select id="fs" onchange="applyF()"><option value="">সবাই</option>${myStaff().map(s=>`<option value="${s.id}" ${F.s===s.id?"selected":""}>${esc(s.name)}</option>`).join("")}</select></div>
  <div><label>কাজ</label><select id="fa" onchange="applyF()">${opts(ACTS,F.a,"সব")}</select></div>
  <div><label>স্ট্যাটাস</label><select id="fst" onchange="applyF()">${opts(["পরিকল্পিত","বাস্তবায়িত"],F.st,"সব")}</select></div>
  <div><label>এরিয়া</label><select id="far" onchange="applyF()">${opts(optsAllowed("areas",D.areas),F.ar,"সব")}</select></div><div><label>প্রজেক্ট</label><select id="fpj" onchange="applyF()">${opts(optsAllowed("projects",D.projects),F.pj,"সব")}</select></div>
  <div><label>চর</label><select id="fch" onchange="applyF()">${opts(optsAllowed("chars",D.chars),F.ch,"সব")}</select></div><div><label>গ্রুপ</label><select id="fgr" onchange="applyF()">${opts(D.groups,F.gr,"সব")}</select></div><div><label>SED হাব</label><select id="fhb" onchange="applyF()">${opts(D.haps,F.hb,"সব")}</select></div></div><br>
  <button onclick="applyF()">ফিল্টার</button> <button class="sec" onclick="F={};render()">রিসেট</button>
  <button class="sec" onclick="csv()">⬇ Excel/CSV</button> <button class="sec" onclick="window.print()">⬇ PDF</button>
  <div class="muted">PDF: প্রিন্ট উইন্ডোতে "Save as PDF" সিলেক্ট করুন</div></div>
  <div class="card"><h3>কর্মী মুভমেন্ট রিপোর্ট</h3>
  <div class="muted"><b>${esc(filtTxt())}</b></div><br>
  <div class="stats"><div><b>${l.length}</b>মোট</div><div><b>${pl}</b>পরিকল্পিত</div><div><b>${dn}</b>বাস্তবায়িত</div></div><br>
  <div class="scroll"><table><tr><th>তারিখ</th><th>স্টাফ</th><th>এরিয়া (প্রজেক্ট)</th><th>কাজ</th><th>গ্রুপ</th><th>SED হাব</th><th>চর</th><th>বেনিফিশিয়ারি</th><th>স্ট্যাটাস</th><th>পরিকল্পনা</th><th>সম্পন্ন নোট</th></tr>
  ${l.map(m=>`<tr><td>${m.date}</td><td>${esc(sName(m.staffId))}</td><td>${esc(apTxt(m))}</td><td>${esc(j(m.act))}</td><td>${esc(j(m.group))}</td><td>${esc(j(m.hap))}</td><td>${esc(j(m.char))}</td><td>${esc(benTxt(m))}</td><td>${m.status}${m.status==="পরিকল্পিত"?` <button class="sm noprint" onclick="doneForm('${m.id}')">বাস্তবায়ন</button>`:""}</td><td>${esc(m.plan)}</td><td>${esc(m.note)}</td></tr>`).join("")||'<tr><td colspan="11" class="muted">কোনো তথ্য নেই</td></tr>'}</table></div></div>`;
}
function filtTxt(){
  const d=v=>v.split("-").reverse().join("-");
  const p=[(F.from?d(F.from):tr("শুরু"))+(LANG==="en"?" to ":" থেকে ")+(F.to?d(F.to):tr("আজ পর্যন্ত"))];
  if(F.s)p.push(tr("স্টাফ")+": "+sName(F.s));
  [["a","কাজ"],["st","স্ট্যাটাস"],["ar","এরিয়া"],["pj","প্রজেক্ট"],["ch","চর"],["gr","গ্রুপ"],["hb","SED হাব"]].forEach(([k,l])=>{if(F[k])p.push(tr(l)+": "+tr(F[k]))});
  return p.join(" · ");
}
function applyF(){F={from:$("ff").value,to:$("ft").value,s:$("fs").value,a:$("fa").value,st:$("fst").value,ar:$("far").value,pj:$("fpj").value,ch:$("fch").value,gr:$("fgr").value,hb:$("fhb").value};render()}
function csv(){
  const q=v=>'"'+String(v||"").replace(/"/g,'""')+'"';
  const rows=[["তারিখ","স্টাফ","এরিয়া (প্রজেক্ট)","কাজ","গ্রুপ","SED হাব","চর","বেনিফিশিয়ারি","স্ট্যাটাস","পরিকল্পনা","সম্পন্ন নোট"]].concat(filtered().map(m=>[m.date,sName(m.staffId),apTxt(m),j(m.act),j(m.group),j(m.hap),j(m.char),benTxt(m),m.status,m.plan,m.note])).map(r=>r.map(c=>tr(c)));
  dl(new Blob(["\ufeff"+rows.map(r=>r.map(q).join(",")).join("\n")],{type:"text/csv;charset=utf-8"}),"movement-report.csv");
}
if(useFB){
  db.collection("app").doc("config").onSnapshot(d=>{READY=true;if(d.exists){const c=d.data();["groups","haps","chars","groupChar","hapChar","inputTypes","projects","areas","adminPass"].forEach(k=>{if(c[k]!==undefined)D[k]=c[k]})}refresh()});
  db.collection("staff").onSnapshot(q=>{D.staff=q.docs.map(x=>x.data());refresh()});
  db.collection("inputs").onSnapshot(q=>{D.inputs=q.docs.map(x=>x.data());refresh()});
  db.collection("bens").onSnapshot(q=>{D.bens=q.docs.map(x=>x.data());refresh()});
  db.collection("moves").onSnapshot(q=>{D.moves=q.docs.map(x=>x.data());refresh()});
}
new MutationObserver(ms=>{if(LANG!=="en")return;for(const m of ms){if(m.type==="characterData")trTxt(m.target);else m.addedNodes.forEach(trTree)}}).observe(document.body,{childList:true,subtree:true,characterData:true});
document.documentElement.lang=LANG;if(LANG==="en")document.title="Staff Movement Monitoring - SED Sector";
trTree(document.body);
(function(){
  const sp=$("splash");if(!sp)return;
  const bar=$("sbar"),pc=$("spc"),st=$("sst"),t0=Date.now();let v=0;
  const iv=setInterval(()=>{
    const el=Date.now()-t0,ok=READY||el>6000;
    const tg=el<2000?el/2000*92:(ok?100:96);
    v+=(tg-v)*0.2;if(tg-v<0.4)v=tg;
    bar.style.width=v+"%";pc.textContent=Math.round(v)+"%";
    st.textContent=v<30?"অ্যাপ চালু হচ্ছে...":v<85?"আগে সেভ করা তথ্য খোলা হচ্ছে...":v<100?"প্রায় শেষ...":"প্রস্তুত!";
    if(v>=100){clearInterval(iv);setTimeout(()=>{sp.style.opacity=0;setTimeout(()=>sp.remove(),600)},250)}
  },50);
})();
window.addEventListener("online",setSync);window.addEventListener("offline",setSync);
render();
</script>
</body>
</html>
